name: Bug Report
description: バグ報告
title: "[Bug] "
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        バグ報告ありがとうございます。以下の情報をできるだけ詳しく記入してください。

  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: 発生している問題の簡潔な説明
      placeholder: 何が起きているかを簡潔に説明してください
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      description: バグを再現する手順
      placeholder: |
        1. '...' に移動
        2. '...' をクリック
        3. '...' までスクロール
        4. エラーが発生
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期待される動作
      description: 本来どうなるべきか
      placeholder: 正常に動作した場合、どうなるべきか
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 実際の動作
      description: 実際に何が起きているか
      placeholder: 実際に起きていること
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: スクリーンショット/ログ
      description: 該当する場合は添付
      placeholder: ドラッグ&ドロップで画像を添付、またはコンソールログを貼り付け
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: 優先度
      description: 問題の緊急度
      options:
        - P0 (クリティカル - 即時対応)
        - P1 (高 - 今週中)
        - P2 (中 - 次スプリント)
        - P3 (低 - バックログ)
      default: 2
    validations:
      required: false

  - type: dropdown
    id: size
    attributes:
      label: 見積りサイズ
      description: 修正にかかる作業量の見積り
      options:
        - XS (15–30分)
        - S (30–60分)
        - M (60–90分)
        - L (2時間超)
    validations:
      required: false

  - type: textarea
    id: related
    attributes:
      label: 関連Issue/PR
      description: 関連する Issue や PR があればリンク
      placeholder: "#123, #456"
    validations:
      required: false
