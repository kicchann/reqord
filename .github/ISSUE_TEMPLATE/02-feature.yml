name: Feature
description: 機能の実装
title: "[Feature] "
labels: ["enhancement"]

body:
  - type: markdown
    attributes:
      value: |
        新機能の提案ありがとうございます。

  - type: textarea
    id: purpose
    attributes:
      label: 目的
      description: 何を、なぜ実装するか
      placeholder: |
        【何を】実装する機能の説明
        【なぜ】この機能が必要な理由
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: 作業内容
      description: 実装に必要なタスク一覧
      placeholder: |
        - [ ] 作業1
        - [ ] 作業2
        - [ ] 作業3
    validations:
      required: true

  - type: textarea
    id: done-criteria
    attributes:
      label: 完了条件
      description: 何をもって完了とするか
      placeholder: |
        - [ ] 機能が実装されている
        - [ ] テストが追加されている
        - [ ] ドキュメントが更新されている
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: 実装メモ
      description: 技術的な詳細、参考コードなど
      placeholder: 関連するコードや設計メモ
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: 優先度
      description: 機能の重要度
      options:
        - P0 (クリティカル - 即時対応)
        - P1 (高 - 今週中)
        - P2 (中 - 次スプリント)
        - P3 (低 - バックログ)
      default: 2
    validations:
      required: false

  - type: dropdown
    id: size
    attributes:
      label: 見積りサイズ
      description: 作業量の見積り
      options:
        - XS (15–30分)
        - S (30–60分)
        - M (60–90分)
        - L (2時間超)
    validations:
      required: false

  - type: textarea
    id: related
    attributes:
      label: 関連Issue/PR
      description: 関連する Issue や PR があればリンク
      placeholder: "#123, #456"
    validations:
      required: false
