name: Epic
description: 大きなテーマをまとめる親Issue
title: "[Epic] "
labels: ["epic"]

body:
  - type: markdown
    attributes:
      value: |
        Epicは複数のIssueをまとめる親Issueです。大きな機能やテーマを管理するために使用します。

  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: このEpicで解決する大きなテーマや目的
      placeholder: このEpicの全体像を説明してください
    validations:
      required: true

  - type: textarea
    id: goals
    attributes:
      label: ゴール
      description: 達成したい目標
      placeholder: |
        - ゴール1
        - ゴール2
    validations:
      required: true

  - type: textarea
    id: deliverables
    attributes:
      label: 成果物
      description: プロダクトとしてユーザーに届く形、成果の確認方法
      placeholder: |
        - プロダクトとしてユーザーに届く形は何か？
        - 成果をどう確認できるか？
    validations:
      required: true

  - type: textarea
    id: child-issues
    attributes:
      label: 関連する子Issue
      description: このEpicに紐づくIssue一覧（後から追記可）
      placeholder: |
        - [ ] #123 タスク1
        - [ ] #124 タスク2
        - [ ] #125 バグ修正
        - [ ] #126 新機能追加
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: 優先度
      description: Epicの重要度
      options:
        - P0 (クリティカル - 即時対応)
        - P1 (高 - 今週中)
        - P2 (中 - 次スプリント)
        - P3 (低 - バックログ)
      default: 1
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: 備考
      description: 補足事項や設計メモなど
      placeholder: その他の参考情報
    validations:
      required: false
