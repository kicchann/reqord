name: reqord実装タスク
description: reqordから自動生成された実装タスク
title: "[Task] "
labels: ["reqord-generated"]

body:
  - type: markdown
    attributes:
      value: |
        このIssueはreqordから自動生成されました。

  - type: textarea
    id: description
    attributes:
      label: タスク説明
      description: このタスクの詳細
    validations:
      required: true

  - type: input
    id: estimated-hours
    attributes:
      label: 見積時間
      description: 実装にかかる推定時間（時間）
      placeholder: "4"
    validations:
      required: false

  - type: textarea
    id: dependencies
    attributes:
      label: 依存タスク
      description: このタスクが依存する他のタスク
      placeholder: |
        - タスク1
        - タスク2
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: 優先度
      options:
        - P0 (クリティカル)
        - P1 (高)
        - P2 (中)
        - P3 (低)
      default: 2
    validations:
      required: false
