name: YAML Lint (.reqord)

on:
  push:
    branches: [main]
    paths:
      - ".reqord/**/*.yaml"
      - ".github/scripts/lint-yaml-hash.sh"
      - ".github/workflows/yaml-lint.yml"
  pull_request:
    branches: [main]
    paths:
      - ".reqord/**/*.yaml"
      - ".github/scripts/lint-yaml-hash.sh"
      - ".github/workflows/yaml-lint.yml"

jobs:
  yaml-hash-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint YAML for unquoted hash patterns
        run: bash .github/scripts/lint-yaml-hash.sh .reqord
