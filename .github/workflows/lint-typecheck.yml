name: Lint & Type Check

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "eslint.config.js"
      - "tsconfig.json"
      - ".github/workflows/lint-typecheck.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "eslint.config.js"
      - "tsconfig.json"
      - ".github/workflows/lint-typecheck.yml"

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build shared (for type references)
        run: pnpm --filter @reqord/shared run build

      - name: Type Check
        run: pnpm run type-check
