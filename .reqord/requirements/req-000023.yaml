successCriteria:
  - reqord feedback sync で feedbackラベル付きGitHub Issueを取得し、.reqord/issues/feedbacks.yaml が更新される
  - reqord feedback sync --from-local で feedbacks.yaml の紐付け情報を元にGitHub Issueのラベルが同期される
  - reqord feedback list でfeedbackラベル付きGitHub Issueの一覧が表示される（feedbacks.yamlから取得）
  - reqord feedback show <issue-number> でFeedbackの詳細（種別・関連アーティファクト・深刻度）が表示される（GitHub + feedbacks.yamlのマージデータ）
  - >-
    reqord feedback link <issue-number> --req <id> で既存Requirementに紐付けられ、feedbacks.yamlのlinkedToが更新され、GitHub
    Issueラベルが更新される
  - >-
    reqord feedback link <issue-number> --created-req でFeedbackから新Requirementが自動採番で作成され、feedbacks.yamlとGitHub
    Issueラベルが更新される
  - reqord feedback link <issue-number> --spec <id> でSpecificationに紐付けられ、feedbacks.yamlとGitHub Issueラベルが更新される
  - reqord feedback close <issue-number> で影響範囲確定後にFeedbackがクローズされ、feedbacks.yamlとGitHub Issueが更新される
  - '@reqord/sharedパッケージにFeedbackIndexのZodスキーマが定義され、feedbacks.yamlバリデーションが実行される'
  - reqord feedback link実行時に--type, --severityオプションでFeedbackのメタデータを設定できる
  - >-
    reqord feedback resolve <req-id> --issue <number>
    でfeedbacks.yamlのlinkedTo.resolvedの該当配列（requirements/specifications）に対象アーティファクトIDが追加される
  - >-
    reqord feedback sync 実行時、既存エントリの手動設定メタデータ（type, severity, linkedTo）は保持され、 GitHub Issueから取得可能な情報（status,
    syncedAt）のみ更新される（マージ更新）
  - 未解決feedbackが紐付けされたRequirement/Specificationに対して承認操作を行う場合、警告が表示される
  - reqord feedback unlink <issue-number> --req <id> でRequirementからリンクが削除され、feedbacks.yamlのlinkedToからも削除される
  - reqord feedback unlink <issue-number> --spec <id> でSpecificationからリンクが削除され、feedbacks.yamlのlinkedToからも削除される
  - reqord feedback close <issue-number> 実行時、紐付けされたartifactに未解決feedbackがある場合、警告メッセージが表示される
  - >-
    reqord feedback create --title <title> --description <text> でISSUE_TEMPLATE準拠のfeedback+reqordラベル付きGitHub Issueが
    [Feedback] prefix付きで作成され、feedbacks.yamlに新規エントリが追加される
