successCriteria:
  - .reqord/settings/setting.yaml で承認前チェック項目（design.md/description.md/カスタムファイル）の有効・無効を制御できる
  - ステータス遷移（draftToApproved, approvedToImplemented, toDraft）ごとにPR要否を設定できる
  - toApproved/toImplemented/toDraftブランチのプレフィックスをカスタマイズできる
  - 未解決フィードバック存在時の動作（警告/ブロック）とseverity閾値を設定できる
  - req implement時のspec未実装チェックを警告/エラーで切り替えられる
  - approved/implemented状態での内容変更時の自動draft戻しを制御できる（always/major-only/never）
  - >-
    不変条件（versioning/cyclicDependencyCheck/statusTransitionRules/schemaValidation）がinvariantsセクションで宣言され、falseを設定するとバリデーションエラーになる
  - setting.yamlが存在しない場合や部分定義の場合はデフォルト値とマージして動作する（後方互換性）
  - Zodスキーマが@reqord/sharedに定義され、バリデーションが行われる
format:
  type: user-story
  userStory:
    as: プロジェクト管理者
    iWant: 設定ファイルでワークフローの挙動をカスタマイズしたい
    soThat: プロジェクトの規模や運用方針に応じて承認プロセスやバリデーションの厳格さを調整できる
