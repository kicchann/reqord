successCriteria:
  - reqord validate impl <spec-id> で実装完了度が検証され、Issue完了率・コンポーネント実装率・テストカバレッジが数値で表示される
  - Specificationに紐づくGitHub Issueの完了状態が確認され、未完了Issue数とopen/closedの内訳が表示される
  - Specificationのdesign.mdに記載されたコンポーネント（ファイルパス）の実装有無が検証され、全件一致でPASSとなる
  - テスト記述の有無が検証され、unit test / integration testのカバレッジが表示される
  - 検証結果が--jsonオプションで構造化出力され、CI連携が可能である
  - '--strict オプション使用時、全チェック項目がcompleteでない場合はexit code 1で終了する'
  - >-
    reqord req implement
    実行時に、対応する全Specificationがimplementedであるか・紐付きIssueが全てclosedであるかの整合性チェックが行われ、不整合があれば警告が表示される（Feedback #221）
