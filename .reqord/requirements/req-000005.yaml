status: draft
priority: medium
createdAt: 2026-02-07T10:00:00Z
updatedAt: 2026-02-22T23:43:25.971Z
versionHistory:
  - version: 1.0.0
    status: implemented
    changedAt: 2026-02-09T12:00:00Z
    summary: Initial implementation (Requirement only)
  - version: 2.0.0
    status: draft
    changedAt: 2026-02-13T00:00:00.000Z
    summary: Reverted to draft for revision based on feedback (#109,
  - version: '3.0'
    status: draft
    changedAt: 2026-02-14T00:00:00.000Z
    summary: 'Simplified versioning: semantic versioning → integer-based (X.Y) format (Issue #247)'
  - version: '4.0'
    status: draft
    changedAt: 2026-02-14T12:00:00.000Z
    summary: >-
      Major design change: Add reqord version command, fully separate versioning from status transitions. Removes
      --major/--patch from draft command. Backward incompatible with v3.0 (Issue #263)
  - version: '5.0'
    status: implemented
    changedAt: 2026-02-20T14:13:19.911Z
    summary: 'Remove gitCommit field from versionHistory (feedback #411)'
files:
  description: requirements/req-000005/description.md
  supplementary: []
successCriteria:
  - reqord version <id> --major/--patch でバージョンを明示的にインクリメントできる
  - 任意のステータス（draft/approved/implemented）でバージョンをインクリメントできる
  - バージョン変更とステータス遷移が完全に分離されている
  - ステータス変更のみではバージョンをインクリメントしない
  - X.Y形式のバージョン番号をサポートする（1.0, 2.0, 1.1など）
  - versionHistory にバージョン履歴が記録される
  - reqord req history <id> / reqord spec history <id> でバージョン履歴を表示できる
  - versionHistoryにgitCommitフィールドを持たない（git log -Sで導出する）
format:
  type: ears
  ears:
    type: event-driven
    trigger: 開発者が要件または仕様の内容を更新する
    condition: 内容フィールド（title, successCriteria, format等）に変更がある
    action: システムはバージョンをインクリメントし履歴を記録する
    response: 変更前の承認情報を保持したまま。ステータス変更のみではバージョンを変えない
