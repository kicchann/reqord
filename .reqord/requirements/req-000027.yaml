successCriteria:
  - .reqord/requirements/req-NNNNNN.yaml 形式でRequirementを保存・読み込みできる
  - .reqord/specifications/spec-NNNNNN.yaml 形式でSpecificationを保存・読み込みできる
  - >-
    .reqord/context/ 配下の product.json, technical.json, structure.json が product.yaml, technical.yaml, structure.yaml
    に変換され、読み込み・書き込みができる
  - 既存のJSONファイルをYAMLに一括変換する reqord migrate-to-yaml コマンドが実装される
  - Zod スキーマは変更せず、JSON-YAML変換レイヤーでフォーマット変換が行われる
  - CLI・Web UI の既存機能がすべてYAML形式で正常動作する（後方互換性維持は不要）
