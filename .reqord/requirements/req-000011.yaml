successCriteria:
  - reqord req draft <id> でflag付きのreq/specをdraft状態に戻せる
  - reqord req approve <id> でGitブランチが作成され、承認依頼PRが自動生成される
  - PR本文にreqordメタデータコメントタグが埋め込まれる
  - CODEOWNERSで指定されたレビュアーがPRに自動アサインされる
  - PRマージ時にRequirementのstatusがapprovedに更新される
  - approve実行時にバージョンをインクリメントしない（バージョン変更はreqord versionコマンドで行う）
  - approve実行時にstatusをapprovedに設定し、PRマージで承認完了
  - reqord req implement <id> でapproved状態のreqをimplementedに遷移できる
  - コマンドのヘルプ・出力が各コマンドの実際の動作を正確に伝える
  - reqord req draft <id> でapproved/implementedからdraftに差し戻す際、影響範囲（blocksで依存する要件）を表示する
  - draft差し戻しはPRを作成し、影響範囲をまとめてレビュー可能にする
