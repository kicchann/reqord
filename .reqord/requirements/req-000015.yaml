successCriteria:
  - reqord spec draft <id> でflag付きのspecをdraft状態に戻せる
  - reqord spec approve <id> でGitブランチが作成され、承認依頼PRが自動生成される
  - approve実行時にstatusをapprovedに設定し、PRマージで承認完了
  - PR本文にreqordメタデータコメントタグが埋め込まれる
  - CODEOWNERSからレビュアーが自動アサインされる
  - PRマージ時にSpecificationのstatusがapprovedに更新される
  - approve実行時にバージョンをインクリメントしない（バージョン変更はreqord versionコマンドで行う）
  - reqord spec implement <id> でapproved状態のspecをimplementedに遷移できる
  - コマンドのヘルプ・出力が各コマンドの実際の動作を正確に伝える
  - reqord spec draft <id> でapproved/implementedからdraftに差し戻す際、影響範囲を表示する
  - draft差し戻しはPRを作成し、影響範囲をまとめてレビュー可能にする
