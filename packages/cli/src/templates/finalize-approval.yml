name: Finalize Approval

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  finalize-approval:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'reqord/') &&
      contains(github.event.pull_request.head.ref, '-approve-v')
    runs-on: ubuntu-latest

    steps:
      - name: Extract entity info from branch name
        id: extract
        run: |
          set -euo pipefail
          BRANCH="${{ github.event.pull_request.head.ref }}"
          echo "Branch: $BRANCH"

          if [[ "$BRANCH" =~ ^reqord/(req|spec)-([0-9]{6})-approve-v(.+)$ ]]; then
            ENTITY_TYPE="${BASH_REMATCH[1]}"
            ENTITY_NUM="${BASH_REMATCH[2]}"
            VERSION="${BASH_REMATCH[3]}"
            ENTITY_ID="${ENTITY_TYPE}-${ENTITY_NUM}"
            echo "entity_type=$ENTITY_TYPE" >> "$GITHUB_OUTPUT"
            echo "entity_id=$ENTITY_ID" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "Extracted: type=$ENTITY_TYPE, id=$ENTITY_ID, version=$VERSION"
          else
            echo "Branch name does not match expected pattern. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout base branch
        if: steps.extract.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Update entity status
        if: steps.extract.outputs.skip != 'true'
        run: |
          set -euo pipefail

          ENTITY_TYPE="${{ steps.extract.outputs.entity_type }}"
          ENTITY_ID="${{ steps.extract.outputs.entity_id }}"
          VERSION="${{ steps.extract.outputs.version }}"
          MERGED_BY="${{ github.event.pull_request.merged_by.login }}"
          NOW="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"

          # Determine file path (YAML preferred, JSON fallback)
          if [ "$ENTITY_TYPE" = "req" ]; then
            DIR=".reqord/requirements"
          else
            DIR=".reqord/specifications"
          fi

          if [ -f "$DIR/$ENTITY_ID.yaml" ]; then
            FILE_PATH="$DIR/$ENTITY_ID.yaml"
            FORMAT="yaml"
          elif [ -f "$DIR/$ENTITY_ID.json" ]; then
            FILE_PATH="$DIR/$ENTITY_ID.json"
            FORMAT="json"
          else
            echo "::error::Entity file not found: $DIR/$ENTITY_ID.{yaml,json}"
            exit 1
          fi

          echo "File: $FILE_PATH (format: $FORMAT)"

          # Check current status (idempotency)
          if [ "$FORMAT" = "yaml" ]; then
            CURRENT_STATUS=$(yq '.status' "$FILE_PATH")
          else
            CURRENT_STATUS=$(jq -r '.status' "$FILE_PATH")
          fi

          if [ "$CURRENT_STATUS" != "approved" ]; then
            echo "Current status is '$CURRENT_STATUS', not 'approved'. Skipping."
            exit 0
          fi

          # Update the entity file
          if [ "$FORMAT" = "yaml" ]; then
            yq -i "
              .status = \"approved\" |
              .updatedAt = \"$NOW\" |
              .currentApproval.approvedAt = \"$NOW\" |
              .currentApproval.approvedBy = [\"$MERGED_BY\"] |
              .versionHistory += [{
                \"version\": \"$VERSION\",
                \"status\": \"approved\",
                \"changedAt\": \"$NOW\",
                \"summary\": \"Approval finalized\"
              }]
            " "$FILE_PATH"
          else
            jq --arg now "$NOW" \
               --arg user "$MERGED_BY" \
               --arg version "$VERSION" \
               '
               .status = "approved" |
               .updatedAt = $now |
               .currentApproval.approvedAt = $now |
               .currentApproval.approvedBy = [$user] |
               .versionHistory += [{
                 version: $version,
                 status: "approved",
                 changedAt: $now,
                 summary: "Approval finalized"
               }]
               ' "$FILE_PATH" > tmp.$$ && mv tmp.$$ "$FILE_PATH"
          fi

          echo "Updated $ENTITY_ID status to approved"

      - name: Commit and push
        if: steps.extract.outputs.skip != 'true'
        run: |
          set -euo pipefail

          ENTITY_ID="${{ steps.extract.outputs.entity_id }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit. Skipping."
            exit 0
          fi

          git commit -m "chore(reqord): finalize approval for $ENTITY_ID"
          git push
